name: CI

on:
    push:
        branches:
            - "*"

jobs:
    psalm:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'

            - name: Run Psalm
              run: php vendor/bin/psalm --config=psalm.xml --no-cache

    tests:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'

            - name: Run PHPUnit
              run: php vendor/bin/phpunit --configuration=phpunit.xml --colors=always